<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Tienda - Grand Theft Auto VI</title>
    <!-- Tailwind CSS para un diseño moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden" id="app">
        
        <!-- PASO 1: DETALLES DEL JUEGO, DESTINATARIO Y PLATAFORMA -->
        <div id="step-1" class="p-6 space-y-6">
            
            <!-- Cabecera con enlace directo a tu banner.png en GitHub -->
            <div class="relative h-44 rounded-xl overflow-hidden flex items-end p-4 shadow-inner border border-slate-800 bg-slate-900 bg-cover bg-center" style="background-image: linear-gradient(to top, rgba(2, 6, 23, 0.9) 0%, rgba(2, 6, 23, 0.3) 60%, transparent 100%), url('https://raw.githubusercontent.com/BandaJesusNazareno/Ventas-de-juego/main/banner.png');">
                
                <span class="absolute top-3 right-3 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-semibold px-2.5 py-1 rounded-full z-10">En Stock</span>
                
                <div class="relative z-10">
                    <h2 class="text-lg font-black tracking-tight text-white drop-shadow-md">Grand Theft Auto VI</h2>
                    <p class="text-xs text-indigo-300 font-semibold">Ultimate Edition • Rockstar Games</p>
                </div>
            </div>

            <!-- SELECCIÓN DE DESTINATARIO Y PLATAFORMA CON ICONOS -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">¿A quién le regalas el juego?</label>
                    <input type="text" id="recipient-input" placeholder="Nombre o Gamertag" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Elige la Plataforma</label>
                    <div class="grid grid-cols-2 gap-2">
                        <!-- PlayStation 5 -->
                        <button type="button" onclick="selectPlatform('PlayStation 5')" id="btn-ps" class="p-2.5 rounded-lg border border-indigo-500 bg-indigo-950/40 text-left transition cursor-pointer flex flex-col justify-center">
                            <div class="flex items-center gap-1.5 font-bold text-xs text-indigo-200">
                                <svg class="w-3.5 h-3.5 fill-current shrink-0" viewBox="0 0 24 24"><path d="M18.8 15.6c-.5-.3-3-1.5-3.5-1.7-.5-.2-.9-.3-1.2.2-.3.5-1.4 1.7-1.7 2-.3.3-.6.3-1.1 0-.5-.3-2.2-.8-4.2-2.6-1.5-1.4-2.6-3.1-2.9-3.6-.3-.5 0-.8.2-1 .2-.2.5-.5.8-.8.3-.3.4-.5.6-.8.2-.3.1-.6 0-.8-.1-.2-1.2-2.8-1.6-3.9-.4-1-.8-1-1.2-1h-1c-.3 0-.8.1-1.2.5-.4.4-1.5 1.5-1.5 3.6s1.6 4.1 1.8 4.4c.2.3 3.1 4.7 7.5 6.6 1.1.5 2 .8 2.7 1 .9.3 1.8.3 2.5.2.8-.1 3-1.2 3.4-2.4.4-1.2.4-2.2.3-2.4-.1-.2-.4-.3-.9-.6z"/></svg>
                                PlayStation 5
                            </div>
                            <span class="text-[8px] text-indigo-400 font-medium pl-5">PRECOMPRAR ›</span>
                        </button>
                        <!-- Xbox Series X|S -->
                        <button type="button" onclick="selectPlatform('Xbox Series X|S')" id="btn-xbox" class="p-2.5 rounded-lg border border-slate-800 bg-slate-950/40 text-left transition cursor-pointer flex flex-col justify-center">
                            <div class="flex items-center gap-1.5 font-bold text-xs text-slate-400" id="xbox-text">
                                <svg class="w-3.5 h-3.5 fill-current shrink-0" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.49 18.06c-.32-.42-1.72-1.92-3.11-3.61-.41-.49-.82-.99-1.22-1.48.24-.31.48-.62.72-.93 1.57-2.02 3.31-4.27 3.61-4.69.58-.8 1.15-1.6 1.72-2.4-1.39-1.12-3.14-1.85-5.06-1.85-2.22 0-4.18.98-5.5 2.52.5.38 1.05.81 1.63 1.28 1.14.93 2.5 2.04 3.18 2.65-.68.61-2.04 1.72-3.18 2.65-.58.47-1.13.9-1.63 1.28 1.32 1.54 3.28 2.52 5.5 2.52 1.92 0 3.67-.73 5.06-1.85-.57-.8-1.14-1.6-1.72-2.4z"/></svg>
                                Xbox Series X|S
                            </div>
                            <span class="text-[8px] text-slate-500 font-medium pl-5" id="xbox-sub">PRECOMPRAR ›</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="space-y-3">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Selecciona la Edición</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="selectEdition('Standard', 79.99)" id="btn-standard" class="p-3 rounded-xl border border-indigo-500 bg-indigo-950/40 text-left transition cursor-pointer">
                        <div class="font-bold text-sm">Standard</div>
                        <div class="text-xs text-indigo-300 font-semibold mt-1">79,99 €</div>
                    </button>
                    <button onclick="selectEdition('Ultimate Edition', 99.99)" id="btn-deluxe" class="p-3 rounded-xl border border-slate-800 bg-slate-950/40 text-left transition cursor-pointer">
                        <div class="font-bold text-sm">Ultimate Edition</div>
                        <div class="text-xs text-slate-400 font-semibold mt-1">99,99 €</div>
                    </button>
                </div>
            </div>

            <button onclick="goToStep(2)" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition cursor-pointer">
                Comprar ahora
            </button>
        </div>

        <!-- PASO 2: MÉTODO DE PAGO Y CONFIRMACIÓN -->
        <div id="step-2" class="p-6 space-y-6 hidden">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <button onclick="goToStep(1)" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 cursor-pointer">← Volver</button>
                <h3 class="font-bold text-sm">Finalizar Pedido</h3>
                <span></span>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 text-sm">
                <div class="flex justify-between text-slate-400">
                    <span id="summary-edition">GTA VI (Standard)</span>
                    <span id="summary-price">79,99 €</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Plataforma</span>
                    <span id="summary-platform" class="text-indigo-400 font-bold">PlayStation 5</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Para el usuario</span>
                    <span id="summary-recipient" class="text-emerald-400 font-bold"></span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Impuestos incluidos</span>
                    <span>0,00 €</span>
                </div>
                <div class="border-t border-slate-800 pt-2 flex justify-between font-bold text-base text-white">
                    <span>Total</span>
                    <span id="summary-total" class="text-indigo-400">79,99 €</span>
                </div>
            </div>

            <div class="space-y-3">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Método de pago simulado</label>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-3 rounded-xl border border-indigo-500 bg-slate-950/40 cursor-pointer">
                        <input type="radio" name="payment" checked class="accent-indigo-500">
                        <span class="text-sm font-medium">Tarjeta de Crédito / Débito (•••• 4242)</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-800 bg-slate-950/40 cursor-pointer">
                        <input type="radio" name="payment" class="accent-indigo-500">
                        <span class="text-sm font-medium">PayPal (Grandtf@gmail.com)</span>[cite: 6]
                    </label>
                </div>
            </div>

            <button onclick="completePurchase()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition cursor-pointer">
                Confirmar y Pagar
            </button>
        </div>

        <!-- PASO 3: PANTALLA DE ÉXITO -->
        <div id="step-3" class="p-8 text-center space-y-6 hidden">
            <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                ✓
            </div>
            <div class="space-y-2">
                <h3 class="text-xl font-black">¡Regalo realizado con éxito!</h3>
                <p class="text-xs text-slate-400">El juego se ha enviado a la cuenta de <span id="final-recipient" class="text-emerald-400 font-bold"></span> en <span id="final-platform" class="text-indigo-400 font-bold"></span>.</p>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-left text-xs space-y-2">
                <div class="text-slate-500">Nº de pedido: <span id="order-id" class="text-slate-300 font-mono"></span></div>
                <div class="text-slate-500">Plataforma: <span id="final-platform-text" class="text-slate-300 font-bold"></span></div>
            </div>

            <button onclick="resetApp()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition cursor-pointer">
                Finalizar compra
            </button>
        </div>

    </div>

    <!-- Script de control de la simulación -->
    <script>
        let selectedEditionName = 'Standard';
        let selectedPrice = 79.99;
        let selectedPlatformName = 'PlayStation 5';

        function selectEdition(edition, price) {
            selectedEditionName = edition;
            selectedPrice = price;

            if (edition === 'Standard') {
                document.getElementById('btn-standard').className = "p-3 rounded-xl border border-indigo-500 bg-indigo-950/40 text-left transition cursor-pointer";
                document.getElementById('btn-deluxe').className = "p-3 rounded-xl border border-slate-800 bg-slate-950/40 text-left transition cursor-pointer";
            } else {
                document.getElementById('btn-deluxe').className = "p-3 rounded-xl border border-indigo-500 bg-indigo-950/40 text-left transition cursor-pointer";
                document.getElementById('btn-standard').className = "p-3 rounded-xl border border-slate-800 bg-slate-950/40 text-left transition cursor-pointer";
            }
        }

        function selectPlatform(platform) {
            selectedPlatformName = platform;
            const psBtn = document.getElementById('btn-ps');
            const xboxBtn = document.getElementById('btn-xbox');
            const xboxText = document.getElementById('xbox-text');
            const xboxSub = document.getElementById('xbox-sub');

            if (platform === 'PlayStation 5') {
                psBtn.className = "p-2.5 rounded-lg border border-indigo-500 bg-indigo-950/40 text-left transition cursor-pointer flex flex-col justify-center";
                psBtn.querySelector('div').className = "flex items-center gap-1.5 font-bold text-xs text-indigo-200";
                psBtn.querySelector('span').className = "text-[8px] text-indigo-400 font-medium pl-5";

                xboxBtn.className = "p-2.5 rounded-lg border border-slate-800 bg-slate-950/40 text-left transition cursor-pointer flex flex-col justify-center";
                xboxText.className = "flex items-center gap-1.5 font-bold text-xs text-slate-400";
                xboxSub.className = "text-[8px] text-slate-500 font-medium pl-5";
            } else {
                xboxBtn.className = "p-2.5 rounded-lg border border-indigo-500 bg-indigo-950/40 text-left transition cursor-pointer flex flex-col justify-center";
                xboxText.className = "flex items-center gap-1.5 font-bold text-xs text-indigo-200";
                xboxSub.className = "text-[8px] text-indigo-400 font-medium pl-5";

                psBtn.className = "p-2.5 rounded-lg border border-slate-800 bg-slate-950/40 text-left transition cursor-pointer flex flex-col justify-center";
                psBtn.querySelector('div').className = "flex items-center gap-1.5 font-bold text-xs text-slate-400";
                psBtn.querySelector('span').className = "text-[8px] text-slate-500 font-medium pl-5";
            }
        }

        function goToStep(step) {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.add('hidden');

            const recipientName = document.getElementById('recipient-input').value.trim() || 'AmigoInvitado';

            if (step === 1) {
                document.getElementById('step-1').classList.remove('hidden');
            } else if (step === 2) {
                document.getElementById('summary-edition').innerText = `GTA VI (${selectedEditionName})`;
                document.getElementById('summary-price').innerText = `${selectedPrice.toFixed(2)} €`;
                document.getElementById('summary-total').innerText = `${selectedPrice.toFixed(2)} €`;
                document.getElementById('summary-platform').innerText = selectedPlatformName;
                document.getElementById('summary-recipient').innerText = recipientName;
                document.getElementById('step-2').classList.remove('hidden');
            }
        }

        function completePurchase() {
            const recipientName = document.getElementById('recipient-input').value.trim() || 'AmigoInvitado';
            const randomId = (selectedPlatformName.includes('PlayStation') ? 'PS5' : 'XBOX') + '-GIFT-' + Math.floor(100000 + Math.random() * 900000);
            
            document.getElementById('order-id').innerText = randomId;
            document.getElementById('final-recipient').innerText = recipientName;
            document.getElementById('final-platform').innerText = selectedPlatformName;
            document.getElementById('final-platform-text').innerText = selectedPlatformName;
            
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
        }

        function resetApp() {
            document.getElementById('recipient-input').value = '';
            selectEdition('Standard', 79.99);
            selectPlatform('PlayStation 5');
            goToStep(1);
        }
    </script>
</body>
</html>
